nombre: win 11 + tailscale + script Download.bat

en:
  flujo_de_trabajo:

empleos:
  rdp seguro:
    Se ejecuta en: windows-2022
    tiempo de espera-minutos: 350

    pasos:
      - nombre: Configurar los ajustes principales de RDP
        correr: |
          # Habilitar Escritorio remoto y deshabilitar la autenticación a nivel de red (si es necesario)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
                             -Nombre "fDenyTSConnections" -Valor 0 -Forzar
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Nombre "Autenticación de usuario" -Valor 0 -Forzar
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Nombre "Capa de seguridad" -Valor 0 -Forzar

          # Elimina cualquier regla existente con el mismo nombre para evitar duplicaciones.
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
         
          # Para realizar pruebas, permita cualquier conexión entrante en el puerto 3389.
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=en acción=permitir protocolo=TCP puerto local=3389

          # (Opcional) Reinicie el servicio de Escritorio remoto para asegurarse de que los cambios surtan efecto.
          Reiniciar-Servicio -Nombre TermService -Forzar

      - nombre: Crear usuario RDP con contraseña fija
        correr: |
          $contraseña = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Nuevo-UsuarioLocal -Nombre "RDP" -Contraseña $securePass -CuentaNuncaExpira
          }
          Agregar miembro del grupo local -Grupo "Administradores" -Miembro "RDP"
          Add-LocalGroupMember -Group "Usuarios de Escritorio Remoto" -Member "RDP"
         
          echo "RDP_CREDS=Usuario: RDP | Contraseña: $password" >> $env:GITHUB_ENV
         
          if (-not (Get-LocalUser -Name "RDP")) {
              Error de escritura: "Error al crear el usuario"
              Salida 1
          }

      - nombre: Instalar Tailscale
        correr: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
         
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - nombre: Establecer conexión con Tailscale
        correr: |
          # Inicia Tailscale con la clave de autenticación proporcionada y establece un nombre de host único.
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
         
          # Esperar a que Tailscale asigne una IP
          $tsIP = $null
          $retries = 0
          mientras (-no $tsIP -y $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Inicio-Sueño -Segundos 5
              $retiros++
          }
         
          si (-no $tsIP) {
              Error de escritura: "No se ha asignado una dirección IP a Tailscale. Saliendo."
              Salida 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
     
      - nombre: Verificar la accesibilidad RDP
        correr: |
          Write-Host "Dirección IP de Tailscale: $env:TAILSCALE_IP"
         
          # Prueba la conectividad usando Test-NetConnection contra la IP de Tailscale en el puerto 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          si (-no $testResult.TcpTestSucceeded) {
              Error de escritura: "Error al conectar con el puerto RDP 3389 mediante TCP".
              Salida 1
          }
          Write-Host "¡Conexión TCP exitosa!"

      - nombre: Mantener conexión + Monitorear usuario RDP
        correr: |
          Write-Host "`n=== ACCESO RDP ==="
          Write-Host "Dirección: $env:TAILSCALE_IP"
          Write-Host "Nombre de usuario: RDP"
          Write-Host "Contraseña: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"

          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"

          mientras ($verdadero) {
              Si (Test-Path $rdpProfile) {
                  intentar {
                      si (-no (Test-Path $startupPath)) {
                          Nuevo-elemento -ItemType Directorio -Path $startupPath -Force | Out-Null
                      }

                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                      Write-Host "✅ Downloads.bat copiado a $downloadPath"

                      # Ejecutar el archivo por lotes por primera vez
                      cmd /c $rutaDescarga
                      Write-Host "✅ Downloads.bat se ejecutó correctamente"
                      romper
                  }
                  atrapar {
                      Write-Host "❌ Error al copiar o ejecutar Downloads.bat: $($_.Exception.Message)"
                      romper
                  }
              }
              demás {
                  Write-Host "[$(Get-Date)] Esperando a que se cree el perfil RDP..."
                  Inicio-Sueño -Segundos 30
              }
          }

          # Mantén vivo al corredor
          mientras ($verdadero) {
              Write-Host "[$(Get-Date)] RDP activo: utilice Ctrl+C en el flujo de trabajo para finalizarlo"
              Inicio-Sueño - 300 segundos
          }
